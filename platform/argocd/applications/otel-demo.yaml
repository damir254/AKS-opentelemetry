apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otel-demo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/damir254/AKS-opentelemetry.git
    targetRevision: main
    path: helm/otel-demo
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  ignoreDifferences:
   - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - RespectIgnoreDifferences=true
