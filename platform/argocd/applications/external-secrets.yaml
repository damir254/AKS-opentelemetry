apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: 2.9.0
      helm:
        releaseName: external-secrets
        valueFiles:
          - $values/platform/external-secrets/values.yaml
    - repoURL: https://github.com/damir254/AKS-opentelemetry.git
      targetRevision: main
      ref: values
      path: platform/external-secrets
      directory:
        include: "{serviceaccount.yaml,clustersecretstore.yaml}"
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
