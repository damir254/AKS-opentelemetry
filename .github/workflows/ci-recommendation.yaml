name: Recommendation CI

on:
  pull_request:
    paths:
      - "src/recommendation/**"
      - ".github/workflows/ci-recommendation.yaml"
      - ".github/workflows/reusable-build-push.yaml"

  push:
    branches:
      - main
    paths:
      - "src/recommendation/**"
      - ".github/workflows/ci-recommendation.yaml"
      - ".github/workflows/reusable-build-push.yaml"

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: src/recommendation/requirements.txt

      - name: Install dependencies
        working-directory: src/recommendation
        run: python -m pip install -r requirements.txt

      - name: Validate Python syntax
        working-directory: src/recommendation
        run: python -m compileall -q .

  build-and-push:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/reusable-build-push.yaml
    with:
      service-name: recommendation
      build-context: .
      dockerfile: src/recommendation/Dockerfile
