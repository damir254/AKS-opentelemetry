name: Reusable ACR Build and Push

on:
  workflow_call:
    inputs:
      service-name:
        description: Image repository name in ACR
        required: true
        type: string
      build-context:
        description: Docker build context relative to the repository root
        required: true
        type: string
      dockerfile:
        description: Dockerfile path relative to the repository root
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Log in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        env:
          ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
        run: az acr login --name "${ACR_LOGIN_SERVER%%.*}"

      - name: Build and push image
        env:
          BUILD_CONTEXT: ${{ inputs.build-context }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          IMAGE: ${{ vars.ACR_LOGIN_SERVER }}/${{ inputs.service-name }}:${{ github.sha }}
        run: |
          docker build --file "$DOCKERFILE" --tag "$IMAGE" "$BUILD_CONTEXT"
          docker push "$IMAGE"
