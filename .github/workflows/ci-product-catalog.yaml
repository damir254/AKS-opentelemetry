name: Product Catalog CI

on:
  pull_request:
    paths:
      - "src/product-catalog/**"
      - ".github/workflows/ci-product-catalog.yaml"
      - ".github/workflows/reusable-build-push.yaml"

  push:
    branches:
      - main
    paths:
      - "src/product-catalog/**"
      - ".github/workflows/ci-product-catalog.yaml"
      - ".github/workflows/reusable-build-push.yaml"

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: src/product-catalog/go.mod
          cache-dependency-path: src/product-catalog/go.sum

      - name: Validate Go packages
        working-directory: src/product-catalog
        run: go test ./...

  build-and-push:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/reusable-build-push.yaml
    with:
      service-name: product-catalog
      build-context: .
      dockerfile: src/product-catalog/Dockerfile
