name: Product Catalog CI

on:
  pull_request:
    paths:
      - "src/product-catalog/**"
      - ".github/workflows/ci-product-catalog.yaml"

  push:
    branches:
      - main
    paths:
      - "src/product-catalog/**"
      - ".github/workflows/ci-product-catalog.yaml"

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: src/product-catalog/go.mod
          cache-dependency-path: src/product-catalog/go.sum

      - name: Validate Go packages
        working-directory: src/product-catalog
        run: go test ./...

  build-and-push:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Log in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        env:
          ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
        run: az acr login --name "${ACR_LOGIN_SERVER%%.*}"

      - name: Build and push image
        working-directory: .
        env:
          IMAGE: ${{ vars.ACR_LOGIN_SERVER }}/product-catalog:${{ github.sha }}
        run: |
          docker build --file src/product-catalog/Dockerfile --tag "$IMAGE" .
          docker push "$IMAGE"